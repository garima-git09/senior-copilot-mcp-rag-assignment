[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C4", "SIM", "B"]
ignore = [
    "SIM117",  # nested `async with` statements are clearer than combined ones for MCP session + client session
    "B008",    # `Field(...)` as an argument default is the standard FastMCP/pydantic/FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]
"rag/tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
