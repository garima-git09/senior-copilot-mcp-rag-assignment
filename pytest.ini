[pytest]
pythonpath =
    .
    apps/alarm-api
    mcp-servers/alarm-management
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths =
    tests
    rag/tests
markers =
    integration: slower tests that spin up an in-process ASGI/HTTP server
    e2e: end-to-end tests combining MCP and RAG
